name: ci
on:
  push:
  pull_request:
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tests_station.py
      - run: python examples/init_local.py
      - run: python station.py wake
      - run: python station.py suites
      - run: python checks/verbs.py
      - run: python checks/capsule.py
